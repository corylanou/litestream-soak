name: sync-upstream-main

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Force a rebuild even if the tracked upstream SHA matches
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-upstream-main
  cancel-in-progress: true

jobs:
  resolve-upstream:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.resolve.outputs.should_build }}
      litestream_sha: ${{ steps.resolve.outputs.litestream_sha }}
      current_litestream_sha: ${{ steps.resolve.outputs.current_litestream_sha }}
      trigger: ${{ steps.resolve.outputs.trigger }}
    steps:
      - id: resolve
        shell: bash
        env:
          CONTROL_BASE_URL: ${{ vars.SOAK_CONTROL_BASE_URL }}
          SOAK_BASIC_AUTH_USERNAME: ${{ secrets.SOAK_BASIC_AUTH_USERNAME }}
          SOAK_BASIC_AUTH_PASSWORD: ${{ secrets.SOAK_BASIC_AUTH_PASSWORD }}
        run: |
          set -euo pipefail

          base_url="${CONTROL_BASE_URL:-https://litestream-soak-ctl.fly.dev}"
          litestream_sha="$(git ls-remote https://github.com/benbjohnson/litestream.git refs/heads/main | awk 'NR==1{print tolower($1)}')"
          if [ -z "${litestream_sha}" ]; then
            echo "failed to resolve upstream Litestream main" >&2
            exit 1
          fi

          force_rebuild="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force || '' }}" = "true" ]; then
            force_rebuild="true"
          fi

          # Resolve the soaked SHA from the authoritative deployment endpoint
          # rather than inferring it from the Prometheus gauge. The gauge keeps a
          # series per status plus a zeroed one for the superseded deployment,
          # and Prometheus collection is not transactional across series, so a
          # scrape landing mid-publication can expose a lone stale SHA.
          #
          # source=main is required: unscoped, the endpoint returns the newest
          # deployment across every source, so an active PR fleet would hand
          # back its own SHA and trigger a main-fleet build.
          #
          # Skipped entirely under force, so a cold-start control plane with no
          # deployment yet (which 404s here) can still be seeded by hand.
          # Declared up front because the force path skips the lookup entirely
          # and the outputs block below expands it unconditionally under set -u.
          current_litestream_sha=""

          should_build="true"
          if [ "${force_rebuild}" != "true" ]; then
            deployment_file="$(mktemp)"
            if ! curl -sS --fail-with-body --retry 3 --retry-delay 5 --max-time 60 \
              --user "${SOAK_BASIC_AUTH_USERNAME}:${SOAK_BASIC_AUTH_PASSWORD}" \
              -o "${deployment_file}" "${base_url}/api/deployments/latest?source=main"; then
              echo "failed to fetch ${base_url}/api/deployments/latest?source=main" >&2
              echo "run with force to build without confirming the soaked SHA" >&2
              exit 1
            fi

            deployment_source="$(jq -r '.deployment.source // empty' "${deployment_file}")"
            if [ "${deployment_source}" != "main" ]; then
              echo "expected a main deployment, got '${deployment_source}'" >&2
              exit 1
            fi

            current_litestream_sha="$(jq -r '.deployment.litestream_sha // empty' "${deployment_file}" | tr '[:upper:]' '[:lower:]')"
            if printf '%s' "${current_litestream_sha}" | grep -Eq '^[0-9a-f]{40}$'; then
              if [ "${current_litestream_sha}" = "${litestream_sha}" ]; then
                should_build="false"
                echo "already soaking upstream main ${litestream_sha}; nothing to build"
              fi
            else
              # Building blind rolls a 15-machine fleet, so require force.
              should_build="false"
              echo "control plane did not report a usable Litestream SHA (got '${current_litestream_sha}'); run with force to override" >&2
            fi
          fi

          trigger="upstream_main_schedule"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            trigger="upstream_main_manual"
          fi

          {
            echo "should_build=${should_build}"
            echo "litestream_sha=${litestream_sha}"
            echo "current_litestream_sha=${current_litestream_sha}"
            echo "trigger=${trigger}"
          } >> "${GITHUB_OUTPUT}"

  build-worker-image:
    needs: resolve-upstream
    if: needs.resolve-upstream.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.build.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v5

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.59

      - id: build
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail

          parse_flyctl_image_ref() {
            local log_file="$1"
            local image_label="$2"
            local image_ref

            image_ref="$(awk '$1 == "image:" && $2 ~ "^registry[.]fly[.]io/litestream-soak:" {print $2}' "${log_file}" | tail -n 1 || true)"
            if [ -z "${image_ref}" ]; then
              echo "failed to parse image ref from flyctl output" >&2
              echo "expected a line matching: image: registry.fly.io/litestream-soak:${image_label}" >&2
              echo "last 40 lines of flyctl output:" >&2
              tail -n 40 "${log_file}" >&2
              return 1
            fi
            if [[ "${image_ref}" != "registry.fly.io/litestream-soak:${image_label}"* ]]; then
              echo "parsed flyctl image ref ${image_ref} does not match expected label ${image_label}" >&2
              echo "last 40 lines of flyctl output:" >&2
              tail -n 40 "${log_file}" >&2
              return 1
            fi

            printf '%s\n' "${image_ref}"
          }

          short_sha="${GITHUB_SHA::12}"
          litestream_sha="${{ needs.resolve-upstream.outputs.litestream_sha }}"
          image_label="sha-${short_sha}-ls-${litestream_sha::12}"
          log_file="$(mktemp)"

          flyctl deploy \
            --remote-only \
            --app litestream-soak \
            --config fly.toml \
            --image-label "${image_label}" \
            --build-arg "LITESTREAM_SHA=${litestream_sha}" \
            --build-only \
            --push 2>&1 | tee "${log_file}"

          if ! image_ref="$(parse_flyctl_image_ref "${log_file}" "${image_label}")"; then
            exit 1
          fi

          echo "image_ref=${image_ref}" >> "${GITHUB_OUTPUT}"

  notify-worker-fleet:
    needs:
      - resolve-upstream
      - build-worker-image
    if: needs.resolve-upstream.outputs.should_build == 'true' && needs.build-worker-image.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - shell: bash
        env:
          CONTROL_BASE_URL: ${{ vars.SOAK_CONTROL_BASE_URL }}
          SOAK_ADMIN_BEARER_TOKEN: ${{ secrets.SOAK_ADMIN_BEARER_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${CONTROL_BASE_URL}" ]; then
            export CONTROL_BASE_URL="https://litestream-soak-ctl.fly.dev"
          fi

          chmod +x scripts/notify-deployment-ready.sh
          ./scripts/notify-deployment-ready.sh \
            "${GITHUB_SHA}" \
            main \
            "${{ needs.resolve-upstream.outputs.trigger }}" \
            "${{ needs.build-worker-image.outputs.image_ref }}" \
            "${{ needs.resolve-upstream.outputs.litestream_sha }}"
