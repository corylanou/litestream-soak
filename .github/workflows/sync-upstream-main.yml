name: sync-upstream-main

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Force a rebuild even if the tracked upstream SHA matches
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-upstream-main
  cancel-in-progress: true

jobs:
  resolve-upstream:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.resolve.outputs.should_build }}
      litestream_sha: ${{ steps.resolve.outputs.litestream_sha }}
      current_litestream_sha: ${{ steps.resolve.outputs.current_litestream_sha }}
      trigger: ${{ steps.resolve.outputs.trigger }}
    steps:
      - id: resolve
        shell: bash
        env:
          CONTROL_BASE_URL: ${{ vars.SOAK_CONTROL_BASE_URL }}
        run: |
          set -euo pipefail

          base_url="${CONTROL_BASE_URL:-https://litestream-soak-ctl.fly.dev}"
          litestream_sha="$(git ls-remote https://github.com/benbjohnson/litestream.git refs/heads/main | awk 'NR==1{print tolower($1)}')"
          if [ -z "${litestream_sha}" ]; then
            echo "failed to resolve upstream Litestream main" >&2
            exit 1
          fi

          metrics_file="$(mktemp)"
          if ! curl -fsSL --retry 3 --retry-delay 5 -o "${metrics_file}" "${base_url}/metrics"; then
            echo "failed to fetch control-plane metrics from ${base_url}/metrics" >&2
            exit 1
          fi

          # The gauge keeps one line per status the deployment has moved through,
          # plus a zeroed line for the superseded deployment, so line order does
          # not identify the live deployment. Only a live status carries a
          # non-zero value. Read from a file so awk never writes to a closed
          # pipe, which is what the previous awk exit did under pipefail.
          #
          # The emitter releases its mutex before writing the gauges
          # (internal/orchestrator/metrics.go), so a slow concurrent observation
          # can set a superseded series non-zero again after a newer one zeroed
          # it, and nothing remembers to clear it afterwards. That makes "the
          # non-zero series" ambiguous rather than authoritative, so collect
          # every distinct non-zero SHA and only trust an unambiguous answer.
          live_shas="$(awk '
            /^soak_control_latest_deployment_version_info\{/ && /source="main"/ {
              if (($NF + 0) == 0) { next }
              split($0, parts, "litestream_sha=\"")
              if (length(parts) > 1) {
                split(parts[2], tail, "\"")
                print tail[1]
              }
            }
          ' "${metrics_file}" | sort -u)"

          # grep -c exits 1 on "no matches" but 2+ on a real error, so treat
          # only exit 1 as an empty count and fail on anything worse rather
          # than letting an unreadable file look like a cold start.
          count_matches() {
            local pattern="$1" file="$2" out rc
            set +e
            out="$(grep -c -- "${pattern}" "${file}")"
            rc=$?
            set -e
            if [ "${rc}" -gt 1 ]; then
              echo "failed to scan control-plane metrics (grep exit ${rc})" >&2
              return 1
            fi
            printf '%s' "${out:-0}"
          }

          printf '%s' "${live_shas}" > "${metrics_file}.shas"
          live_sha_count="$(count_matches . "${metrics_file}.shas")"
          main_deployment_lines="$(count_matches '^soak_control_latest_deployment_version_info{.*source="main"' "${metrics_file}")"

          # resolved: exactly one well-formed live SHA. none: no main deployment
          # at all, a genuine cold start. ambiguous: anything else, which must
          # never build, because a wrong build rolls the whole fleet whereas a
          # skipped one just waits for the next run.
          current_litestream_sha=""
          if [ "${live_sha_count}" -eq 1 ]; then
            # Normalise case before comparing: deploy-main preserves a
            # configured SHA verbatim, so an uppercase value would otherwise
            # read as a mismatch against lowercase git ls-remote output.
            candidate="$(printf '%s' "${live_shas}" | tr '[:upper:]' '[:lower:]')"
            if printf '%s' "${candidate}" | grep -Eq '^[0-9a-f]{40}$'; then
              resolution="resolved"
              current_litestream_sha="${candidate}"
            else
              # Empty deployment values are exported as the literal "unknown"
              # sentinel, which is non-empty and would otherwise read as a real
              # mismatch against upstream.
              resolution="ambiguous"
              echo "control plane reported a non-SHA litestream value (${candidate})" >&2
            fi
          elif [ "${live_sha_count}" -gt 1 ]; then
            resolution="ambiguous"
            echo "control plane reported ${live_sha_count} live main SHAs: $(printf '%s' "${live_shas}" | tr '\n' ' ')" >&2
          elif [ "${main_deployment_lines}" -gt 0 ]; then
            resolution="ambiguous"
            echo "control plane reports a main deployment with no live status line" >&2
          else
            # No main series at all is either a genuine cold start or a control
            # plane whose metric registration silently failed, and the two are
            # indistinguishable from here. Cold start happens once, with a human
            # present, so require an explicit force dispatch rather than letting
            # a metrics outage roll the fleet.
            resolution="ambiguous"
            echo "control plane reports no main deployment series; run with force to seed a cold start" >&2
          fi

          force_rebuild="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force || '' }}" = "true" ]; then
            force_rebuild="true"
          fi

          should_build="true"
          if [ "${force_rebuild}" != "true" ]; then
            case "${resolution}" in
              resolved)
                if [ "${current_litestream_sha}" = "${litestream_sha}" ]; then
                  should_build="false"
                  echo "already soaking upstream main ${litestream_sha}; nothing to build"
                fi
                ;;
              ambiguous)
                should_build="false"
                echo "cannot identify the soaked Litestream SHA; skipping this cycle rather than rolling the fleet" >&2
                ;;
            esac
          fi

          trigger="upstream_main_schedule"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            trigger="upstream_main_manual"
          fi

          {
            echo "should_build=${should_build}"
            echo "litestream_sha=${litestream_sha}"
            echo "current_litestream_sha=${current_litestream_sha}"
            echo "trigger=${trigger}"
          } >> "${GITHUB_OUTPUT}"

  build-worker-image:
    needs: resolve-upstream
    if: needs.resolve-upstream.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.build.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v5

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.59

      - id: build
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail

          parse_flyctl_image_ref() {
            local log_file="$1"
            local image_label="$2"
            local image_ref

            image_ref="$(awk '$1 == "image:" && $2 ~ "^registry[.]fly[.]io/litestream-soak:" {print $2}' "${log_file}" | tail -n 1 || true)"
            if [ -z "${image_ref}" ]; then
              echo "failed to parse image ref from flyctl output" >&2
              echo "expected a line matching: image: registry.fly.io/litestream-soak:${image_label}" >&2
              echo "last 40 lines of flyctl output:" >&2
              tail -n 40 "${log_file}" >&2
              return 1
            fi
            if [[ "${image_ref}" != "registry.fly.io/litestream-soak:${image_label}"* ]]; then
              echo "parsed flyctl image ref ${image_ref} does not match expected label ${image_label}" >&2
              echo "last 40 lines of flyctl output:" >&2
              tail -n 40 "${log_file}" >&2
              return 1
            fi

            printf '%s\n' "${image_ref}"
          }

          short_sha="${GITHUB_SHA::12}"
          litestream_sha="${{ needs.resolve-upstream.outputs.litestream_sha }}"
          image_label="sha-${short_sha}-ls-${litestream_sha::12}"
          log_file="$(mktemp)"

          flyctl deploy \
            --remote-only \
            --app litestream-soak \
            --config fly.toml \
            --image-label "${image_label}" \
            --build-arg "LITESTREAM_SHA=${litestream_sha}" \
            --build-only \
            --push 2>&1 | tee "${log_file}"

          if ! image_ref="$(parse_flyctl_image_ref "${log_file}" "${image_label}")"; then
            exit 1
          fi

          echo "image_ref=${image_ref}" >> "${GITHUB_OUTPUT}"

  notify-worker-fleet:
    needs:
      - resolve-upstream
      - build-worker-image
    if: needs.resolve-upstream.outputs.should_build == 'true' && needs.build-worker-image.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - shell: bash
        env:
          CONTROL_BASE_URL: ${{ vars.SOAK_CONTROL_BASE_URL }}
          SOAK_ADMIN_BEARER_TOKEN: ${{ secrets.SOAK_ADMIN_BEARER_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${CONTROL_BASE_URL}" ]; then
            export CONTROL_BASE_URL="https://litestream-soak-ctl.fly.dev"
          fi

          chmod +x scripts/notify-deployment-ready.sh
          ./scripts/notify-deployment-ready.sh \
            "${GITHUB_SHA}" \
            main \
            "${{ needs.resolve-upstream.outputs.trigger }}" \
            "${{ needs.build-worker-image.outputs.image_ref }}" \
            "${{ needs.resolve-upstream.outputs.litestream_sha }}"
