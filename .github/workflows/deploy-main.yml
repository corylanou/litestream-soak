name: deploy-main

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "grafana/**"
      - "tmp/**"
  workflow_dispatch:
    inputs:
      upstream_sync:
        description: Resolve current upstream main for the worker build
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
      control_changed: ${{ steps.detect.outputs.control_changed }}
      worker_changed: ${{ steps.detect.outputs.worker_changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - id: target
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - id: baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AFTER_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail

          baseline=""
          if successful_runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-main.yml/runs?branch=main&status=success&per_page=100" --jq '.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch") | .id')"; then
            while IFS= read -r run_id; do
              [[ "${run_id}" =~ ^[0-9]+$ ]] || continue
              if ! candidates="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | .name | select(startswith("main-deployment-checkpoint-v1-")) | ltrimstr("main-deployment-checkpoint-v1-")')"; then
                echo "::warning::Unable to read deployment checkpoint; selecting both components."
                break
              fi
              while IFS= read -r candidate; do
                if [[ "${candidate}" =~ ^[0-9a-f]{40}$ ]] && git merge-base --is-ancestor "${candidate}" "${AFTER_SHA}"; then
                  baseline="${candidate}"
                  break
                fi
              done <<< "${candidates}"
              [ -z "${baseline}" ] || break
            done <<< "${successful_runs}"
          else
            echo "::warning::Unable to read successful deployment history; selecting both components."
          fi
          echo "sha=${baseline}" >> "${GITHUB_OUTPUT}"

      - id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ steps.baseline.outputs.sha }}
          AFTER_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail

          control_changed=false
          worker_changed=false

          if [ -z "${BEFORE_SHA}" ] || [ "${EVENT_NAME}" = "workflow_dispatch" ] || [ "${BEFORE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            control_changed=true
            worker_changed=true
          elif ! changed_files="$(git -c core.quotePath=false diff --no-renames --name-only "${BEFORE_SHA}" "${AFTER_SHA}" --)"; then
            echo "::warning::Unable to determine changed paths; selecting both components for deployment."
            control_changed=true
            worker_changed=true
          else
            while IFS= read -r file; do
              case "$file" in
                cmd/soakctl/*|internal/orchestrator/*|internal/model/*|internal/flyapi/*|internal/reporting/*|internal/workload/*|internal/s3util/*|fly.control.toml|Dockerfile.control|docker-entrypoint.sh|.dockerignore|go.mod|go.sum|.github/workflows/deploy-main.yml)
                  control_changed=true
                  ;;
              esac

              case "$file" in
                cmd/soakworker/*|internal/worker/*|internal/replay/*|internal/workload/*|internal/reporting/*|fly.toml|Dockerfile.worker|docker-entrypoint.sh|datasets/*|.dockerignore|go.mod|go.sum|scripts/notify-deployment-ready.sh|.github/workflows/deploy-main.yml)
                  worker_changed=true
                  ;;
              esac
            done <<< "${changed_files}"
          fi

          echo "control_changed=${control_changed}" >> "${GITHUB_OUTPUT}"
          echo "worker_changed=${worker_changed}" >> "${GITHUB_OUTPUT}"

  verify:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.changes.outputs.target_sha }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: go test ./...
      - run: go build ./cmd/soakctl ./cmd/soakworker

  deploy-control-plane:
    needs:
      - changes
      - verify
    if: needs.changes.outputs.control_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.changes.outputs.target_sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.59

      - env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          TARGET_SHA: ${{ needs.changes.outputs.target_sha }}
        run: |
          set -euo pipefail
          flyctl deploy --remote-only --config fly.control.toml --app litestream-soak-ctl --image-label "control-${TARGET_SHA}"
          {
            echo "### Control deployment"
            echo "Repository revision: ${TARGET_SHA}"
            echo "Fly deployment completed successfully."
          } >> "${GITHUB_STEP_SUMMARY}"

  build-worker-image:
    needs:
      - changes
      - verify
    if: needs.changes.outputs.worker_changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.build.outputs.image_ref }}
      litestream_sha: ${{ steps.build.outputs.litestream_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.changes.outputs.target_sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.59

      - id: build
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          TARGET_SHA: ${{ needs.changes.outputs.target_sha }}
          SOAK_LITESTREAM_SHA: ${{ inputs.upstream_sync && 'main' || vars.SOAK_LITESTREAM_SHA }}
        run: |
          set -euo pipefail

          parse_flyctl_image_ref() {
            local log_file="$1"
            local image_label="$2"
            local image_ref

            image_ref="$(awk '$1 == "image:" && $2 ~ "^registry[.]fly[.]io/litestream-soak:" {print $2}' "${log_file}" | tail -n 1 || true)"
            if [ -z "${image_ref}" ]; then
              echo "failed to parse image ref from flyctl output" >&2
              echo "expected a line matching: image: registry.fly.io/litestream-soak:${image_label}" >&2
              echo "last 40 lines of flyctl output:" >&2
              tail -n 40 "${log_file}" >&2
              return 1
            fi
            if [[ "${image_ref}" != "registry.fly.io/litestream-soak:${image_label}"* ]]; then
              echo "parsed flyctl image ref ${image_ref} does not match expected label ${image_label}" >&2
              echo "last 40 lines of flyctl output:" >&2
              tail -n 40 "${log_file}" >&2
              return 1
            fi

            printf '%s\n' "${image_ref}"
          }

          short_sha="${TARGET_SHA::12}"
          log_file="$(mktemp)"
          build_args=()
          litestream_ref="${SOAK_LITESTREAM_SHA:-main}"

          if [[ "${litestream_ref}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            litestream_sha="${litestream_ref}"
          else
            if [ "${litestream_ref}" = "main" ]; then
              litestream_ref="refs/heads/main"
            fi
            litestream_sha="$(git ls-remote https://github.com/benbjohnson/litestream.git "${litestream_ref}" | awk 'NR==1{print $1}')"
            if [ -z "${litestream_sha}" ]; then
              echo "failed to resolve Litestream ref ${litestream_ref}" >&2
              exit 1
            fi
          fi

          build_args+=(--build-arg "LITESTREAM_SHA=${litestream_sha}")
          image_label="sha-${short_sha}-ls-${litestream_sha::12}"

          flyctl deploy \
            --remote-only \
            --app litestream-soak \
            --config fly.toml \
            --image-label "${image_label}" \
            "${build_args[@]}" \
            --build-only \
            --push 2>&1 | tee "${log_file}"

          if ! image_ref="$(parse_flyctl_image_ref "${log_file}" "${image_label}")"; then
            exit 1
          fi

          echo "image_ref=${image_ref}" >> "${GITHUB_OUTPUT}"
          echo "litestream_sha=${litestream_sha}" >> "${GITHUB_OUTPUT}"

  notify-worker-fleet:
    needs:
      - changes
      - build-worker-image
      - deploy-control-plane
    if: ${{ !cancelled() && needs.changes.outputs.worker_changed == 'true' && needs.build-worker-image.result == 'success' && (needs.deploy-control-plane.result == 'success' || needs.deploy-control-plane.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.changes.outputs.target_sha }}

      - shell: bash
        env:
          TARGET_SHA: ${{ needs.changes.outputs.target_sha }}
          DEPLOY_TRIGGER: ${{ inputs.upstream_sync && 'upstream_main_sync' || 'github_actions_main' }}
          CONTROL_BASE_URL: ${{ vars.SOAK_CONTROL_BASE_URL }}
          SOAK_ADMIN_BEARER_TOKEN: ${{ secrets.SOAK_ADMIN_BEARER_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${CONTROL_BASE_URL}" ]; then
            export CONTROL_BASE_URL="https://litestream-soak-ctl.fly.dev"
          fi

          chmod +x scripts/notify-deployment-ready.sh
          ./scripts/notify-deployment-ready.sh "${TARGET_SHA}" main "${DEPLOY_TRIGGER}" "${{ needs.build-worker-image.outputs.image_ref }}" "${{ needs.build-worker-image.outputs.litestream_sha }}"

      - name: Record accepted worker version
        env:
          TARGET_SHA: ${{ needs.changes.outputs.target_sha }}
          IMAGE_REF: ${{ needs.build-worker-image.outputs.image_ref }}
          LITESTREAM_SHA: ${{ needs.build-worker-image.outputs.litestream_sha }}
        run: |
          {
            echo "### Worker deployment request accepted"
            echo "Repository revision: ${TARGET_SHA}"
            echo "Image: ${IMAGE_REF}"
            echo "Litestream revision: ${LITESTREAM_SHA}"
            echo "Fleet rollout and verification are asynchronous; this is not evidence of fleet convergence."
          } >> "${GITHUB_STEP_SUMMARY}"

  deployment-checkpoint:
    needs:
      - changes
      - verify
      - deploy-control-plane
      - build-worker-image
      - notify-worker-fleet
    if: ${{ !cancelled() && needs.verify.result == 'success' && (needs.deploy-control-plane.result == 'success' || needs.deploy-control-plane.result == 'skipped') && (needs.notify-worker-fleet.result == 'success' || (needs.changes.outputs.worker_changed == 'false' && needs.notify-worker-fleet.result == 'skipped')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.59

      - name: Record actual component artifacts and health
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          TARGET_SHA: ${{ needs.changes.outputs.target_sha }}
          WORKER_IMAGE: ${{ needs.build-worker-image.outputs.image_ref }}
          LITESTREAM_SHA: ${{ needs.build-worker-image.outputs.litestream_sha }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          for component in control worker; do
            app=litestream-soak
            if [ "${component}" = control ]; then app=litestream-soak-ctl; fi
            flyctl machine list --app "${app}" --json |
              jq '[.[] | {id, state, region, image_ref, image: .config.image, checks: [.checks[]? | {name, status, updated_at}]}]' > "evidence/${component}.json"
          done
          jq -n --arg revision "${TARGET_SHA}" --arg image "${WORKER_IMAGE}" --arg litestream "${LITESTREAM_SHA}" \
            '{reconciled_revision: $revision, accepted_worker_image: $image, accepted_litestream_revision: $litestream}' > evidence/checkpoint.json
          {
            echo "### Actual component snapshot"
            echo "Observed at $(date -u +%FT%TZ). Images and health below are from Fly Machines, not inferred from the repository SHA."
            echo '```json'
            jq -s '{control: .[0], worker: .[1], checkpoint: .[2]}' evidence/control.json evidence/worker.json evidence/checkpoint.json
            echo '```'
            echo "Worker rollout may still be in progress. Skipped components retain the actual images shown above."
          } >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@v4
        with:
          name: main-deployment-checkpoint-v1-${{ needs.changes.outputs.target_sha }}
          path: evidence/
          if-no-files-found: error
