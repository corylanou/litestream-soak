name: ci

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: go version
      - run: go test -race ./...
      - run: go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  images:
    timeout-minutes: 35
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [control, worker]
    steps:
      - uses: actions/checkout@v5

      - name: Build images and record compiler metadata
        env:
          COMPONENT: ${{ matrix.component }}
          LITESTREAM_SHA: 4ed7a308f6271ebfd2b0a6e4b70b03011a37e4a3
        run: |
          echo "litestream_sha=${LITESTREAM_SHA}"
          docker build --progress=plain -f "Dockerfile.${COMPONENT}" \
            --build-arg LITESTREAM_SHA="${LITESTREAM_SHA}" \
            -t "soak-${COMPONENT}:ci" .
          docker run --rm --entrypoint sh "soak-${COMPONENT}:ci" \
            -c 'cat /opt/soak/*.buildinfo'

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Scan shipped binaries and retain comparison evidence
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          mkdir -p evidence binaries
          container=$(docker create "soak-${COMPONENT}:ci")
          docker cp "$container:/opt/soak/." evidence/
          if [ "$COMPONENT" = control ]; then
            names="soakctl flyctl"
          else
            names="soakworker litestream litestream-test"
          fi
          failed=0
          for name in $names; do
            docker cp "$container:/usr/local/bin/$name" "binaries/$name"
            role=operational
            sha="$GITHUB_SHA"
            case "$name" in
              flyctl) sha=203d7369ecb26c9adecadb501cd95682decdb527 ;;
              litestream) role=candidate; sha=$(cat evidence/litestream.sha) ;;
              litestream-test) sha=ae88b164dd6304bcbb654a681df767ee59042eed ;;
            esac
            bash scripts/scan-binary.sh "$role" "$sha" "binaries/$name" "evidence/scans/$name" || failed=1
          done
          exit "$failed"

      - name: Upload security evidence even on scan failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-${{ matrix.component }}-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
